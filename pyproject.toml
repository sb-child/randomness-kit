[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "builder_cb"
backend-path = ["."]

[project]
name = "randomness-kit"
description = "some tools about randomness calculation"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = ["maturin>=1.14.1"]
authors = [{ "name" = "sbchild", "email" = "sbchild0@gmail.com" }]
license = { file = "LICENSE" }

[tool.maturin]
features = ["pyo3/extension-module", "pyo3/experimental-inspect"]
include = ["py.typed"]

[tool.maturin.generate-ci.github]
# Finally found: https://github.com/PyO3/maturin/blob/main/src/pyproject_toml.rs#L487
args = "--generate-stubs"
linux = { "targets" = ["x86_64"] }
musllinux = { "targets" = ["x86_64"] }
