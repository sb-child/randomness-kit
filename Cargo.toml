[package]
name = "randomness-kit"
description = "some tools about randomness calculation"
repository = "https://github.com/sb-child/randomness-kit"
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["sbchild <sbchild0@gmail.com>"]

[lib]
name = "randomness_kit"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.2" }
secrets = { git = "https://github.com/sb-child/secrets-rs", rev = "2bf8870156a8115fd7b71aa8cd620088521a5104", features = [
    "use-libsodium-sys",
] }
libsodium-rs = { git = "https://github.com/sb-child/libsodium-rs", rev = "9957fa20b60a845d84d7daa9e215b3563306aeac", features = [
    "fetch-latest",
    "optimized",
] }
rayon = "1.12.0"
rand = "0.10.2"
unic = "0.9.0"
cjk = "0.2.5"
zerocopy = "0.8.56"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = 'abort'
strip = 'debuginfo' # otherwise PyO3 can't introspect the library to generate type stubs
